<section class="access-denied" aria-labelledby="access-denied-title">
  <span class="access-denied__icon">
    <mat-icon>lock</mat-icon>
  </span>
  <h1 id="access-denied-title" class="access-denied__title">Access denied</h1>
  <p class="access-denied__message">
    @if (roleLabel(); as role) {
      Your role (<strong>{{ role }}</strong
      >) does not have permission to view this page.
    } @else {
      You do not have permission to view this page.
    }
    Contact an administrator if you believe this is a mistake.
  </p>
  <a matButton="filled" routerLink="/dashboard">
    <mat-icon>arrow_back</mat-icon>
    Back to dashboard
  </a>
</section>
